name: Build Blender APK

# Reactive/blender-for-android rebuild via host-executable DNA/RNA generation.
#
# Strategy
#  - The dshawshank fork deliberately disabled build-time DNA/RNA generation
#    (it ran makesdna/makesrna as Android apps on-device instead) and hard-coded
#    Windows D:/ paths and Windows .exe tools (datatoc/msgfmt). None of that can
#    run headless on Linux CI, and the on-device SRNA path is circular (MakeSRNA
#    links bf_rna/bf_dna which need the generated RNA files to exist).
#  - Fix: rebuild makesdna/makesrna/datatoc/msgfmt as native x64 Linux host
#    executables from their committed C sources, re-enable the commented
#    add_custom_command generators, sed the D:/ paths to the CI layout, then
#    run the Android build through Utilities/MakeBlender and APP/OBlender.

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # Base dir matching the original "D:/FreeProjects/Blender/Blender" layout.
  BLROOT: "${{ github.workspace }}/Blender"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout APP (workflow host)
        uses: actions/checkout@v4
        with:
          repository: usernameisrobert/APP-android_arm64
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ env.BLROOT }}/APP-android_arm64

      - name: Checkout Blender-android_arm64
        uses: actions/checkout@v4
        with:
          repository: usernameisrobert/Blender-android_arm64
          ref: blender-v3.6-release
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ env.BLROOT }}/Blender-android_arm64

      - name: Checkout lib-android_arm64
        uses: actions/checkout@v4
        with:
          repository: usernameisrobert/lib-android_arm64
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ env.BLROOT }}/lib-android_arm64

      - name: Checkout Utilities-android_arm64
        uses: actions/checkout@v4
        with:
          repository: usernameisrobert/Utilities-android_arm64
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ env.BLROOT }}/Utilities-android_arm64

      - name: Set up JDK 11 (AGP 4.1.1 needs <= JDK 11)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up JDK 17 (sdkmanager needs newer Java)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android cmdline-tools + SDK packages
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/clt.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/clt.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          SM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-30" "build-tools;30.0.3" "ndk;21.4.7075529" "cmake;3.10.2.4988404"
          ls "$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/ndk"

      - name: Re-select JDK 11 for Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Rewrite hard-coded Windows paths to CI layout
        run: |
          grep -rl 'D:/FreeProjects/Blender/Blender' \
            "$BLROOT/Blender-android_arm64" \
            "$BLROOT/Utilities-android_arm64" \
            "$BLROOT/APP-android_arm64" 2>/dev/null | while read -r f; do
            sed -i 's|D:/FreeProjects/Blender/Blender|'"$BLROOT"'|g' "$f"
          done
          # The dshawshank fork hard-codes the Python include dir with the wrong
          # case: real layout is cpython/include/Include/Python.h (capital I),
          # but the find module points at cpython/include/include/. Windows
          # filesystems are case-insensitive so it worked there; Linux is not.
          FINDPM="$BLROOT/Blender-android_arm64/build_files/cmake/Modules/FindPythonLibsUnix.cmake"
          sed -i 's|cpython/include/include/|cpython/include/Include/|g' "$FINDPM"
          echo "--- sanity grep (should be empty) ---"
          grep -rn 'D:/FreeProjects/Blender/Blender' "$BLROOT" || echo "ok: no hardcoded paths remain"
          echo "--- python include dir after fix ---"
          grep -nE 'PYTHON_INCLUDE_DIR|PYTHON_INCLUDE_CONFIG_DIR' "$FINDPM"

      - name: Re-enable build-time DNA/RNA generation + host executables
        run: |
          M=$(realpath "$BLROOT/Blender-android_arm64/source/blender/makesdna/intern/CMakeLists.txt")
          R=$(realpath "$BLROOT/Blender-android_arm64/source/blender/makesrna/intern/CMakeLists.txt")
          # makesdna: enable the generator executable + its add_custom_command.
          python3 - "$M" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          s = s.replace(
              'add_library(makesdna STATIC\n        ${SRC})',
              'add_executable(makesdna ${SRC} ${SRC_DNA_INC})')
          s = s.replace(
              '#add_custom_command(\n#  OUTPUT\n#    ${CMAKE_CURRENT_BINARY_DIR}/dna.c',
              'add_custom_command(\n  OUTPUT\n    ${CMAKE_CURRENT_BINARY_DIR}/dna.c')
          s = s.replace('#    ${CMAKE_CURRENT_BINARY_DIR}/dna_type_offsets.h', '    ${CMAKE_CURRENT_BINARY_DIR}/dna_type_offsets.h')
          s = s.replace('#    ${CMAKE_CURRENT_BINARY_DIR}/dna_verify.c', '    ${CMAKE_CURRENT_BINARY_DIR}/dna_verify.c')
          s = s.replace('#  COMMAND', '  COMMAND')
          s = s.replace('#    "$<TARGET_FILE:makesdna>"', '    "$<TARGET_FILE:makesdna>"')
          s = s.replace('#    ${CMAKE_CURRENT_BINARY_DIR}/dna.c', '    ${CMAKE_CURRENT_BINARY_DIR}/dna.c')
          s = s.replace('#    ${CMAKE_CURRENT_BINARY_DIR}/dna_type_offsets.h', '    ${CMAKE_CURRENT_BINARY_DIR}/dna_type_offsets.h')
          s = s.replace('#    ${CMAKE_CURRENT_BINARY_DIR}/dna_verify.c', '    ${CMAKE_CURRENT_BINARY_DIR}/dna_verify.c')
          s = s.replace('#    ${CMAKE_SOURCE_DIR}/source/blender/makesdna/', '    ${CMAKE_SOURCE_DIR}/source/blender/makesdna/')
          s = s.replace('#  DEPENDS makesdna', '  DEPENDS makesdna')
          s = s.replace('#)', ')')
          open(p, 'w').write(s)
          PY
          # makesrna: enable the generator executable.
          python3 - "$R" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          s = s.replace(
              'add_library(makesrna STATIC',
              'add_executable(makesrna')
          s = s.replace('#add_executable(makesrna ${SRC} ${SRC_RNA_INC} ${SRC_DNA_INC})',
                        'add_executable(makesrna ${SRC} ${SRC_RNA_INC} ${SRC_DNA_INC})')
          open(p, 'w').write(s)
          PY
          echo "--- verify ---"
          grep -nE "add_executable\(makesdna|^add_custom_command|DEPENDS makesdna|add_executable\(makesrna" \
            "$M" "$R"

      - name: Provide Linux datatoc/msgfmt for the build cache dir
        run: |
          # Blender build needs datatoc + msgfmt as runnable tools. They exist as
          # Unix targets in the tree and are produced during the first configure;
          # ensure the Utilities copy is ignored (Windows exe) by not using it.
          rm -f "$BLROOT/Utilities-android_arm64/Utilities/datatoc.exe" \
                "$BLROOT/Utilities-android_arm64/Utilities/datatoc_icon.exe" \
                "$BLROOT/Utilities-android_arm64/Utilities/msgfmt.exe"
          echo "Windows exes removed (Linux build will compile its own datatoc/msgfmt)."

      - name: Install Gradle 6.5 (wrapper jar is not committed in these repos)
        run: |
          curl -fsSL -o /tmp/gradle-bin.zip \
            "https://services.gradle.org/distributions/gradle-6.5-bin.zip"
          unzip -q /tmp/gradle-bin.zip -d /opt
          echo "/opt/gradle-6.5/bin" >> "$GITHUB_PATH"
          gradle --version 2>&1 | head -6

      - name: Patch GHOST Android input backend (distinct mouse buttons)
        run: |
          F="$BLROOT/Blender-android_arm64/intern/ghost/intern/GHOST_SystemAndroid.cc"
          if grep -q 'buttonPressFromState' "$F"; then
            echo "input patch already present"
          else
            sed -i 's|currentButton(app)|buttonPressFromState(buttonState)|g' "$F"
            echo "applied (manual review recommended)"
          fi

      - name: Build with MakeBlender (produces static libs incl. generated DNA/RNA)
        working-directory: ${{ env.BLROOT }}/Utilities-android_arm64/MakeBlender
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          NDK_ROOT: /usr/local/lib/android/sdk/ndk/21.4.7075529
        run: |
          set -o pipefail
          printf 'sdk.dir=%s\nndk.dir=%s\n' "$ANDROID_SDK_ROOT" "$NDK_ROOT" > local.properties
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$NDK_ROOT"
          export JAVA_HOME="$JAVA_HOME_11_X64"
          gradle --no-daemon :app:externalNativeBuildRelease 2>&1 | tee /tmp/makeblender.log

      - name: Build OBlender (final APK)
        working-directory: ${{ env.BLROOT }}/APP-android_arm64/OBlender
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          NDK_ROOT: /usr/local/lib/android/sdk/ndk/21.4.7075529
        run: |
          set -o pipefail
          printf 'sdk.dir=%s\nndk.dir=%s\n' "$ANDROID_SDK_ROOT" "$NDK_ROOT" > local.properties
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$NDK_ROOT"
          export JAVA_HOME="$JAVA_HOME_11_X64"
          gradle --no-daemon :app:assembleRelease 2>&1 | tee /tmp/oblender.log

      - name: Locate APK artifact
        id: apk
        run: |
          APK=$(find "$BLROOT/APP-android_arm64" -name '*.apk' 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found"; exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blender-arm64.apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
